# The remote backstop: what a clone without local hooks pushed still cannot
# slip past. The tree gate runs on the pushed tree; the message audit runs on
# the pushed range — a new branch against the default branch, the first push
# of the default branch itself on its head message only, a branch delete
# skipped outright (no tree to check out). Local hooks block before history
# exists, this gates the push (scripts/README.md is the tool menu).
name: gate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  gate:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: tree gate
        run: scripts/check.sh
      - name: message audit (push)
        if: github.event_name == 'push'
        env:
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          BEFORE="${{ github.event.before }}"
          if [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            printf 'message audit range: %s..%s\n' "$BEFORE" "${{ github.sha }}"
            scripts/commit-msg.sh --audit "$BEFORE..${{ github.sha }}"
          elif git show-ref --verify --quiet "refs/remotes/origin/$DEFAULT" &&
               [ "$(git rev-parse "origin/$DEFAULT")" != "$(git rev-parse HEAD)" ]; then
            printf 'message audit range: origin/%s..HEAD\n' "$DEFAULT"
            scripts/commit-msg.sh --audit "origin/$DEFAULT..HEAD"
          else
            git log -1 --format=%B > /tmp/ci-msg
            scripts/commit-msg.sh /tmp/ci-msg
          fi
      - name: message audit (PR)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          printf 'message audit range: origin/%s..HEAD\n' "$BASE"
          scripts/commit-msg.sh --audit "origin/$BASE..HEAD"
